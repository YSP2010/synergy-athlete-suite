name: Autoformat

# Manuell startbar unter GitHub → Actions → "Autoformat" → "Run workflow".
# Formatiert das gesamte Repo mit Prettier und committet das Ergebnis –
# kein lokales Setup und keine Lovable-Credits nötig.
on: workflow_dispatch

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Prettier ausführen
        run: bun run format

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "style: Prettier-Autoformat (kompletter Codebestand)"
          git push
